plugins {
    id 'com.android.application'
}

// Release signing: a dedicated keystore kept out of git, so a reinstall never wipes Vox's saved data.
// home/.env holds VOX_KEYSTORE (path), VOX_KEYSTORE_PASSWORD, VOX_KEY_ALIAS and VOX_KEY_PASSWORD.
// Without it the release build falls back to the debug key; build-and-install.sh refuses to install that.
def voxEnv = new Properties()
def envFile = rootProject.file('.env')
if (envFile.exists()) envFile.withInputStream { voxEnv.load(it) }
def releaseStore = voxEnv.getProperty('VOX_KEYSTORE') ? file(voxEnv.getProperty('VOX_KEYSTORE')) : null

android {
    namespace 'tv.voxclean.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.voxclean.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    signingConfigs {
        release {
            if (releaseStore != null && releaseStore.exists()) {
                storeFile releaseStore
                storePassword voxEnv.getProperty('VOX_KEYSTORE_PASSWORD')
                keyAlias voxEnv.getProperty('VOX_KEY_ALIAS')
                keyPassword voxEnv.getProperty('VOX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig releaseStore != null && releaseStore.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the pure logic, src/test.
    testImplementation 'junit:junit:4.13.2'
}
