plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.voxclean.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.voxclean.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName 'spike'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
